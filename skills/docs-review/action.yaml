version: 1
name: docs-review
description: Review documentation for staleness by checking git changes since the last review. Use when asked to "review docs", "check documentation", or validate docs are up to date.
prompt: |-
  # Docs Review

  Reviews documentation for staleness by checking git changes since the last review and identifying docs that may need updating.

  ## How to Run

  The pipeline lives at the skill's directory. Determine the skill directory from this file's location, then run:

  ```bash
  # Run full docs review
  bash <skill-dir>/docs-review.sh

  # Review only docs matching a pattern
  bash <skill-dir>/docs-review.sh --filter=mcp

  # Force review all docs (ignore last review state)
  bash <skill-dir>/docs-review.sh --full

  # Set base commit manually
  bash <skill-dir>/docs-review.sh --since=abc123
  ```

  ## Pipeline

  ```
  01-find-docs.sh      ->  Discover all documentation files
          |
  02-get-changes.sh    ->  Get git changes since last review
          |
  03-review.sh (xN)    ->  Review each doc against changes (parallel)
          |
  04-aggregate.sh      ->  Combine results, determine verdict
          |
  05-report.sh         ->  Generate markdown report
  ```

  ## What Gets Reviewed

  | Pattern | Description |
  |---------|-------------|
  | `README.md` | Project/component readmes |
  | `CLAUDE.md` | Claude-specific instructions |
  | `docs/*.md` | Dedicated documentation |
  | `*.md` in root | Top-level docs |
  | `QA.md` | QA checklists |

  ## Staleness Detection

  Documentation is flagged as potentially stale when:

  1. **API changes** -- function signatures, parameters, or return types changed
  2. **Config changes** -- environment variables, config keys added/removed
  3. **Flow changes** -- business logic or control flow significantly altered
  4. **Dependency changes** -- dependencies added/removed that affect usage
  5. **Structural changes** -- files moved, renamed, or deleted

  ## State Tracking

  The pipeline tracks when reviews were run in `.last-review` (next to the script). After a successful review, the current HEAD commit is recorded so the next run only reviews changes since then.

  ## When the User Asks to Review Docs

  1. Run the pipeline with appropriate flags
  2. Summarize: total docs, current vs stale, list stale docs with reasons
  3. Link to the full report in `.reports/`

  ## Options

  The caller may have supplied these. If one matters and you were not told its
  value, ask rather than assuming a default.

  - `filter` — Only review docs matching pattern (e.g. "mcp")
  - `full` — Force review all docs, ignore last review state (flag, no value)
  - `since` — Review changes since a specific commit hash
requires:
  tools: [Bash, Read, Grep, Glob]
